server:
  port: ${PORT:8080}

internal:
  gateway:
    secret: MySuperSecretInternalKey123!

# URL của unified backend service (set env var BACKEND_URL trên Render)
backend:
  url: ${BACKEND_URL:http://localhost:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: charming-squid-97832.upstash.io
      port: 6379
      ssl:
        enabled: true
      password: gQAAAAAAAX4oAAIgcDFjNjgyZTNhY2JiMWM0ZWMyODMxOGZlNmZhMGRjZjNhNw
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "https://*.vercel.app"
              - "https://*.onrender.com"
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # Auth routes
        - id: auth-service
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/auth/**
          filters:
            - RateLimitFilter

        - id: user-service-secured
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/user/**, /users/**
          filters:
            - JwtAuthenticationFilter

        # Product routes - public GET
        - id: product-service-public
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/products/**, /test/**
            - Method=GET, OPTIONS
          filters:
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

        # Product routes - secured POST/PUT/DELETE
        - id: product-service-secured
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/products/**
            - Method=POST, PUT, DELETE, PATCH
          filters:
            - JwtAuthenticationFilter
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

        # Cart routes
        - id: cart-service
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/cart/**
          filters:
            - JwtAuthenticationFilter
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

        # Order routes
        - id: order-service
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/api/orders/**, /orders/**
          filters:
            - JwtAuthenticationFilter
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

        # Checkout route
        - id: order-checkout-route
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/checkout/**, /checkout
          filters:
            - RewritePath=/checkout, /api/orders/checkout
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

        # Payment callback - no JWT (VNPay callback)
        - id: payment-callback
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/api/payment/**
          filters:
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

        # Promotion - public validate/apply
        - id: promotion-public
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/api/promotions/validate, /api/promotions/apply
          filters:
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

        # Promotion - secured
        - id: promotion-service
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/api/promotions/**
          filters:
            - JwtAuthenticationFilter
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

        # Notification Service
        - id: notification-service
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthenticationFilter
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

        # Shipping Service
        - id: shipping-service
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/api/shipping/**
          filters:
            - JwtAuthenticationFilter
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

        # Admin routes
        - id: admin-service
          uri: ${BACKEND_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/**
          filters:
            - JwtAuthenticationFilter
            - AddRequestHeader=X-Internal-Secret, ${internal.gateway.secret}

jwt:
  secret: ThuongChoNhungNguoiThichCodeTayNhuBanNhungKhoaNayPhaiDuDaiMoiAnToan123!@#

# Disable Eureka since we use direct URL routing
eureka:
  client:
    enabled: false
    registerWithEureka: false
    fetchRegistry: false

management:
  tracing:
    sampling:
      probability: 0.0
